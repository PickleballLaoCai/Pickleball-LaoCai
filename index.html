<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pickleball Lào Cai</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f4fb;
      color: #222;
    }

    .header {
      background: #3158ad;
      color: white;
      padding: 35px 20px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 30px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 16px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .welcome {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      text-align: center;
    }

    .welcome h2 {
      color: #3158ad;
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .menu button {
      border: none;
      background: white;
      border-radius: 18px;
      padding: 25px 10px;
      font-size: 17px;
      font-weight: bold;
      color: #3158ad;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }

    .menu button:active {
      transform: scale(0.97);
    }

    .footer {
      text-align: center;
      color: #777;
      padding: 30px 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🏓 Pickleball Lào Cai</h1>
    <p>Cộng đồng Pickleball Lào Cai</p>
  </div>

  <div class="container">

    <div class="welcome">
      <h2>Chào mừng bạn!</h2>
      <p>
        Nền tảng quản lý thành viên, trình độ
        và giải đấu Pickleball.
      </p>
    </div>

    <div class="menu">

      <button>👤<br>Thành viên</button>

      <button>📊<br>Chấm trình</button>

      <button>🏆<br>Giải đấu</button>

      <button>🎾<br>Kết quả</button>

    </div>

  </div>

  <div class="footer">
    Pickleball Lào Cai © 2026
  </div>

</body>
</html>
